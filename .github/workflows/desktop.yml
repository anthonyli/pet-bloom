name: 桌面安装包

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '正式签名并发布到当前仓库 / Sign and publish to this repository'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ inputs.publish && 'release' || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            os: macos-15-intel
            command: desktop:build:mac:arm64
            certificate: MAC_CSC_LINK
            password: MAC_CSC_KEY_PASSWORD
          - target: mac-x64
            os: macos-15-intel
            command: desktop:build:mac:x64
            certificate: MAC_CSC_LINK
            password: MAC_CSC_KEY_PASSWORD
            executable: dist/mac/PetBloom.app/Contents/MacOS/PetBloom
          - target: win-x64
            os: windows-latest
            command: desktop:build:win
            certificate: WIN_CSC_LINK
            password: WIN_CSC_KEY_PASSWORD
            executable: dist/win-unpacked/PetBloom.exe
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: 限制正式发布分支
        if: inputs.publish
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm typecheck
      - name: 回归测试
        run: pnpm test
      - name: 生成预览安装包（不发布）
        if: ${{ !inputs.publish }}
        run: pnpm ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 生成正式签名安装包
        if: inputs.publish
        run: pnpm ${{ matrix.command }} --release
        env:
          CSC_LINK: ${{ secrets[matrix.certificate] }}
          CSC_KEY_PASSWORD: ${{ secrets[matrix.password] }}
          APPLE_ID: ${{ matrix.target != 'win-x64' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.target != 'win-x64' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.target != 'win-x64' && secrets.APPLE_TEAM_ID || '' }}
      - name: 验证桌面窗口、备份与持久化
        if: matrix.executable != ''
        run: pnpm desktop:test "${{ matrix.executable }}"
      - name: 保存安装包与更新清单
        uses: actions/upload-artifact@v4
        with:
          name: PetBloom-${{ matrix.target }}
          path: |
            dist/PetBloom-*.dmg
            dist/PetBloom-*.zip
            dist/PetBloom-*.exe
            dist/PetBloom-*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  prepare:
    name: 汇总并校验发布资产
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: PetBloom-*
          path: downloaded
      - name: 读取项目版本
        id: metadata
        run: node --input-type=module -e 'import fs from "node:fs"; const {version} = JSON.parse(fs.readFileSync("package.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`)'
      - name: 校验哈希并合并两种 Mac 架构
        run: pnpm desktop:release:prepare downloaded release-assets "${{ steps.metadata.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: PetBloom-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布到当前仓库 Releases
    if: inputs.publish
    needs: prepare
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PetBloom-release-assets
          path: release-assets
      - name: 完整上传后发布正式 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          tag="v$VERSION"
          if gh release view "$tag" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            printf '%s\n' '该版本已存在，拒绝覆盖 / Release already exists; refusing to overwrite.' >&2
            exit 1
          fi
          gh release create "$tag" --repo "$RELEASE_REPOSITORY" --target "$RELEASE_COMMIT" --draft \
            --title "PetBloom · 萌芽 $VERSION" \
            --notes $'Windows x64、Mac Apple Silicon 与 Intel 安装包及更新清单。升级保留本机数据；建议先导出 JSON 备份。\n\nInstallers and update manifests for Windows x64, Mac Apple Silicon and Intel. Upgrades preserve local data; export a JSON backup first.'
          gh release upload "$tag" release-assets/* --repo "$RELEASE_REPOSITORY"
          gh release edit "$tag" --repo "$RELEASE_REPOSITORY" --draft=false --latest
